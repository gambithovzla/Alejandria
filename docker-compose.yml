services:
  postgres:
    image: postgres:16
    container_name: novel-engine-postgres
    environment:
      POSTGRES_DB: novel_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - novel-engine-postgres:/var/lib/postgresql/data

volumes:
  novel-engine-postgres:
